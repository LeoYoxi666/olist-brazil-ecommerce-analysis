name: Python CI

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - ".flake8"
      - "pyproject.toml"
      - "requirements.txt"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".flake8"
      - "pyproject.toml"
      - "requirements.txt"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check import ordering
        run: python -m isort --check-only src scripts tests

      - name: Check formatting
        run: python -m black --check src scripts tests

      - name: Run Flake8
        run: python -m flake8 src scripts tests

      - name: Run mypy
        run: python -m mypy src

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider
